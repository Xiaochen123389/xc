/* Foreign Trade Order & Inventory Management System — Brand Tokens */

:root {

  --fto-primary-800: #3730a3;
  --fto-primary-900: #312e81;

  /* Neutral scale — Slate */
  --fto-slate-50: #f8fafc;
  --fto-slate-100: #f1f5f9;
  --fto-slate-200: #e2e8f0;
  --fto-slate-300: #cbd5e1;

  --fto-slate-900: #0f172a;

  /* Semantic aliases */
  --fto-background: #ffffff;
  --fto-foreground: #0f172a;
  --fto-card: #ffffff;
  --fto-card-foreground: #0f172a;
  --fto-popover: #ffffff;

  --fto-secondary: #f1f5f9;
  --fto-secondary-foreground: #334155;
  --fto-muted: #f1f5f9;
  --fto-muted-foreground: #64748b;
  --fto-accent: #eef2ff;
  --fto-accent-foreground: #4338ca;
  --fto-border: #e2e8f0;
  --fto-input: #e2e8f0;
  --fto-ring: #4f46e5;

  /* State colors */
  --fto-state-success: #16a34a;
  --fto-state-success-bg: #dcfce7;
  --fto-state-warning: #d97706;
  --fto-state-warning-bg: #fef3c7;
  --fto-state-error: #dc2626;
  --fto-state-error-bg: #fee2e2;
  --fto-state-info: #2563eb;
  --fto-state-info-bg: #dbeafe;

  /* Surface/depth */
  --fto-surface: #ffffff;
  --fto-surface-2: #f8fafc;
  --fto-surface-3: #f1f5f9;
  --fto-ink: #0f172a;
  --fto-ink-2: #475569;
  --fto-ink-3: #94a3b8;
  --fto-line: #e2e8f0;

  /* Radius */
  --fto-radius-small: 4px;
  --fto-radius-medium: 8px;
  --fto-radius-large: 12px;
  --fto-radius-full: 9999px;

  /* Shadows */
  --fto-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --fto-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --fto-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* Typography */
  --fto-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --fto-font-mono: "SF Mono", "Fira Code", "Noto Sans Mono", monospace;
}

.dark {
  --fto-background: #0b0b0f;
  --fto-foreground: #f8fafc;
  --fto-card: #14141a;
  --fto-card-foreground: #f8fafc;
  --fto-popover: #14141a;
  --fto-popover-foreground: #f8fafc;
  --fto-primary: #6366f1;
  --fto-primary-foreground: #ffffff;
  --fto-secondary: #1e293b;
  --fto-secondary-foreground: #cbd5e1;
  --fto-muted: #1e293b;
  --fto-muted-foreground: #94a3b8;
  --fto-accent: #312e81;
  --fto-accent-foreground: #c7d2fe;
  --fto-border: #334155;
  --fto-input: #334155;
  --fto-ring: #6366f1;
  --fto-surface: #14141a;
  --fto-surface-2: #1e293b;
  --fto-surface-3: #0f172a;
  --fto-ink: #f8fafc;
  --fto-ink-2: #cbd5e1;
  --fto-ink-3: #64748b;
  --fto-line: #334155;
}

    </style>

<body class="min-h-screen font-sans antialiased">

  <!-- Sidebar -->
  <aside
    class="fixed top-0 left-0 bottom-0 z-40 flex flex-col"
    style="width: var(--shell-sidebar-width); background-color: var(--fto-surface-2); border-right: 1px solid var(--fto-line);"
  >
    <!-- Logo / App Name -->
    <div
      class="flex h-[64px] items-center gap-3 px-6"
      style="border-bottom: 1px solid var(--fto-line);"
    >
      <i data-lucide="package" class="h-6 w-6" style="color: var(--fto-primary);"></i>
      <span class="text-base font-semibold" style="color: var(--fto-ink);">外贸订单与库存一体化管理系统</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 py-4">
      <ul class="flex flex-col gap-1">
        <li>
          <a
            href="products-v4.html"
            data-nav-key="products"
            data-dom-id="nav-products"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="background-color: var(--fto-accent); color: var(--fto-accent-foreground);"
          >
            <i data-lucide="package" class="h-5 w-5" ></i>
            <span>商品总表</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-management.html"
            data-nav-key="supplier-management"
            data-dom-id="nav-supplier-management"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="factory" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>供应商管理</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-orders-v2.html"
            data-nav-key="supplier-orders"
            data-dom-id="nav-supplier-orders"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="truck" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>订单汇总/供应商订货</span>
          </a>
        </li>
        <li>
          <a
            href="warehouse-inbound.html"
            data-nav-key="warehouse-inbound"
            data-dom-id="nav-warehouse-inbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="scan-barcode" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>入库管理</span>
          </a>
        </li>
        <li>
          <a
            href="inventory.html"
            data-nav-key="inventory"
            data-dom-id="nav-inventory"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="warehouse" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>库存查询</span>
          </a>
        </li>
        <li>
          <a
            href="outbound.html"
            data-nav-key="outbound"
            data-dom-id="nav-outbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="arrow-right-from-line" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>出库管理</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Top Toolbar -->
  <header
    class="fixed top-0 right-0 z-30 flex items-center justify-between px-6"
    style="left: var(--shell-sidebar-width); height: var(--shell-toolbar-height); background-color: var(--fto-surface); border-bottom: 1px solid var(--fto-line);"
  >
    <div class="flex items-center gap-4">
      <button type="button" class="rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
      <h1 class="text-lg font-semibold" style="color: var(--fto-ink);">商品总表管理 - 优化版</h1>
    </div>

    <div class="flex items-center gap-4">
      <!-- Global Search -->
      <div class="relative hidden sm:block">
        <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
        <input
          type="text"
          placeholder="全局搜索..."
          class="h-9 w-64 rounded-lg pl-9 pr-3 text-sm outline-none focus:ring-2"
          style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
        />
      </div>

      <!-- Notifications -->
      <button type="button" class="relative rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="bell" class="h-5 w-5"></i>
        <span
          class="absolute right-1.5 top-1.5 flex h-4 min-w-[16px] items-center justify-center rounded-full px-1 text-[10px] font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >3</span>
      </button>

      <!-- User -->
      <div class="flex items-center gap-3">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >管</div>
        <span class="hidden text-sm font-medium md:block" style="color: var(--fto-ink);">管理员</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main
    class="min-h-screen"
    style="margin-left: var(--shell-sidebar-width); padding-top: var(--shell-toolbar-height); background-color: var(--fto-background);"
  >
    <div class="p-6">
      <div
        class="rounded-xl p-6"
        style="background-color: var(--fto-card); border: 1px solid var(--fto-line); border-radius: var(--fto-radius-large); box-shadow: var(--fto-shadow-1);"
      >
        <!-- SLOT: pageHeaderActions -->
        <div class="mb-5">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div class="relative w-full md:w-80">
              <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
              <input
                id="search-input"
                type="text"
                placeholder="按编号/产品名称/规格搜索"
                class="h-9 w-full rounded-lg pl-9 pr-3 text-sm outline-none focus:ring-2"
                style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
              />
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button
                id="btn-import"
                type="button"
                class="inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium transition-colors hover:opacity-80"
                style="background-color: var(--fto-card); border-color: var(--fto-border); color: var(--fto-ink);"
              >
                <i data-lucide="file-up" class="h-4 w-4" style="color: var(--fto-ink-3);"></i>
                导入 Excel
              </button>
              <button
                id="btn-export"
                type="button"
                class="inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium transition-colors hover:opacity-80"
                style="background-color: var(--fto-card); border-color: var(--fto-border); color: var(--fto-ink);"
              >
                <i data-lucide="file-down" class="h-4 w-4" style="color: var(--fto-ink-3);"></i>
                导出 Excel
              </button>
              <button
                id="btn-add"
                type="button"
                class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors hover:opacity-90"
                style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
              >
                <i data-lucide="plus" class="h-4 w-4"></i>
                新增商品
              </button>
            </div>
          </div>
        </div>
        <!-- /SLOT: pageHeaderActions -->

        <!-- SLOT: mainContent -->
        <div>
          <!-- 统计卡片（动态）：仅保留 SKU 总数 -->
          <div class="mb-5 grid grid-cols-1 gap-4">
            <div class="rounded-lg p-4" style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-line);">
              <div class="text-xs font-medium" style="color: var(--fto-ink-3);">商品 SKU 总数</div>
              <div id="stat-sku" class="mt-1 text-2xl font-semibold" style="color: var(--fto-ink);">0</div>
            </div>
          </div>

          <!-- 数据表格 -->
          <div class="overflow-x-auto rounded-lg" style="border: 1px solid var(--fto-line);">
            <table class="data-table w-full border-collapse" style="min-width: 2800px;">
              <thead style="color: var(--fto-ink-2);">
                <tr>
                  <th class="text-left font-medium" style="min-width: 40px;"><input type="checkbox" /></th>
                  <th class="text-left font-medium" style="min-width: 120px;">编号</th>
                  <th class="text-left font-medium" style="min-width: 72px;">产品图片</th>
                  <th class="text-left font-medium" style="min-width: 140px;">产品名称</th>
                  <th class="text-left font-medium" style="min-width: 160px;">产品名称/规格</th>
                  <th class="text-left font-medium" style="min-width: 120px;">海关编码</th>
                  <th class="text-left font-medium" style="min-width: 140px;">单个条码</th>
                  <th class="text-left font-medium" style="min-width: 140px;">中包条码</th>
                  <th class="text-left font-medium" style="min-width: 140px;">纸箱条码</th>
                  <th class="text-left font-medium" style="min-width: 110px;">生产日期</th>
                  <th class="text-left font-medium" style="min-width: 200px;">配料表</th>
                  <th class="text-left font-medium" style="min-width: 220px;">营养成分表</th>
                  <th class="text-right font-medium" style="min-width: 80px;">箱装数量</th>
                  <th class="text-right font-medium" style="min-width: 80px;">中包数量</th>
                  <th class="text-right font-medium" style="min-width: 80px;">中包数</th>
                  <th class="text-right font-medium" style="min-width: 60px;">长</th>
                  <th class="text-right font-medium" style="min-width: 60px;">宽</th>
                  <th class="text-right font-medium" style="min-width: 60px;">高</th>

          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

            if (n > max) max = n;
          }
        });
        return 'SP-2025-' + String(max + 1).padStart(3, '0');

                  '<button type="button" class="row-del rounded-md p-1.5 transition-colors hover:opacity-80" data-id="' + esc(p.id) + '" title="删除" style="color: var(--fto-state-error);"><i data-lucide="trash-2" class="h-4 w-4"></i></button>' +
                '</div>' +
              '</td>' +
            '</tr>';
        }).join('');

        tbody.innerHTML = html;

        /* 统计卡片：实时计算（仅 SKU 总数） */
        statSku.textContent = String(products.length);

        pageInfo.textContent = '共 ' + products.length + ' 条，第 1 / 1 页';

        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }

      /* ---------------- 只读详情弹窗 ---------------- */
      var DETAIL_FIELDS = [
        { label: '编号', key: 'id', mono: true },
        { label: '产品名称', key: 'name' },
        { label: '产品名称/规格', key: 'spec' },
        { label: '海关编码', key: 'hsCode', mono: true },
        { label: '单个条码', key: 'unitBarcode', mono: true },
        { label: '中包条码', key: 'midBarcode', mono: true },
        { label: '纸箱条码', key: 'cartonBarcode', mono: true },
        { label: '生产日期', key: 'prodDate' },
        { label: '配料表', key: 'ingredients' },
        { label: '营养成分表', key: 'nutrition' },
        { label: '箱装数量', key: 'boxQty', num: true },
        { label: '中包数量', key: 'midQty', num: true },
        { label: '中包数', key: 'midCount', num: true },
        { label: '长', key: 'len', num: true },
        { label: '宽', key: 'width', num: true },
        { label: '高', key: 'height', num: true },
        { label: '净重', key: 'netWeight', num: true },
        { label: '毛重', key: 'grossWeight', num: true },
        { label: '体积', key: 'volume', num: true },
        { label: '价格 (元/箱）', key: 'price', num: true },
        { label: 'U', key: 'U', num: true },
        { label: 'S', key: 'S', num: true },
        { label: 'T', key: 'T', num: true },
        { label: 'M', key: 'M', num: true },
        { label: 'B', key: 'B', num: true },
        { label: 'AZ', key: 'AZ', num: true },
        { label: '总件数', key: 'total1', num: true },
        { label: '总件数', key: 'total2', num: true },
        { label: '金额', key: 'amount', money: true }
      ];

      function openDetail(record) {
        var html = DETAIL_FIELDS.map(function (f) {
          var raw = record[f.key];
          var val;
          if (raw == null || raw === '') {
            val = '—';
          } else if (f.money) {
            val = fmtMoney(raw);
          } else if (f.num) {
            val = fmtNum(raw);
          } else {
            val = esc(String(raw));
          }
          return '<div class="detail-item">' +
            '<div class="detail-label">' + esc(f.label) + '</div>' +
            '<div class="detail-value' + (f.mono ? ' font-mono' : '') + '">' + val + '</div>' +
            '</div>';
        }).join('');

        detailBody.innerHTML = html;
        detailOverlay.classList.remove('hidden');

        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }

      function closeDetail() {
        detailOverlay.classList.add('hidden');
      }

      /* ---------------- 模态弹窗：新增 / 编辑 ---------------- */
      var editingId = null;
      var FIELD_IDS = [
        'f-id', 'f-name', 'f-spec', 'f-hsCode', 'f-unitBarcode', 'f-midBarcode', 'f-cartonBarcode',
        'f-prodDate', 'f-ingredients', 'f-nutrition', 'f-boxQty', 'f-midQty', 'f-midCount',
        'f-len', 'f-width', 'f-height', 'f-netWeight', 'f-grossWeight', 'f-volume', 'f-price',
        'f-U', 'f-S', 'f-T', 'f-M', 'f-B', 'f-AZ', 'f-total1', 'f-total2', 'f-amount'
      ];

      function openModal(record) {
        editingId = record ? record.id : null;
        modalTitle.textContent = record ? '编辑商品' : '新增商品';

        if (record) {
          document.getElementById('f-id').value = record.id;
          document.getElementById('f-name').value = record.name || '';
          document.getElementById('f-spec').value = record.spec || '';
          document.getElementById('f-hsCode').value = record.hsCode || '';
          document.getElementById('f-unitBarcode').value = record.unitBarcode || '';
          document.getElementById('f-midBarcode').value = record.midBarcode || '';
          document.getElementById('f-cartonBarcode').value = record.cartonBarcode || '';
          document.getElementById('f-prodDate').value = record.prodDate || '';
          document.getElementById('f-ingredients').value = record.ingredients || '';
          document.getElementById('f-nutrition').value = record.nutrition || '';
          document.getElementById('f-boxQty').value = record.boxQty || 0;
          document.getElementById('f-midQty').value = record.midQty || 0;
          document.getElementById('f-midCount').value = record.midCount || 0;
          document.getElementById('f-len').value = record.len || 0;
          document.getElementById('f-width').value = record.width || 0;
          document.getElementById('f-height').value = record.height || 0;
          document.getElementById('f-netWeight').value = record.netWeight || 0;
          document.getElementById('f-grossWeight').value = record.grossWeight || 0;
          document.getElementById('f-volume').value = record.volume || 0;
          document.getElementById('f-price').value = record.price || 0;
          document.getElementById('f-U').value = record.U || 0;
          document.getElementById('f-S').value = record.S || 0;
          document.getElementById('f-T').value = record.T || 0;
          document.getElementById('f-M').value = record.M || 0;
          document.getElementById('f-B').value = record.B || 0;
          document.getElementById('f-AZ').value = record.AZ || 0;
          document.getElementById('f-total1').value = record.total1 || 0;
          document.getElementById('f-total2').value = record.total2 || 0;
          document.getElementById('f-amount').value = record.amount || 0;
        } else {
          FIELD_IDS.forEach(function (id) {
            document.getElementById(id).value = '';
          });
          /* 数字字段默认 0 */
          ['f-boxQty', 'f-midQty', 'f-midCount', 'f-len', 'f-width', 'f-height',
           'f-netWeight', 'f-grossWeight', 'f-volume', 'f-price',
           'f-U', 'f-S', 'f-T', 'f-M', 'f-B', 'f-AZ', 'f-total1', 'f-total2', 'f-amount'
          ].forEach(function (id) {
            document.getElementById(id).value = 0;
          });
          document.getElementById('f-id').value = nextId();
        }

        overlay.classList.remove('hidden');
      }

      function closeModal() {
        overlay.classList.add('hidden');
        editingId = null;
      }

      function saveRecord() {
        var name = document.getElementById('f-name').value.trim();
        var spec = document.getElementById('f-spec').value.trim();
        if (!name || !spec) {
          alert('产品名称与产品名称/规格为必填项');
          return;
        }

        var data = {
          id: document.getElementById('f-id').value.trim() || nextId(),
          name: name,
          spec: spec,
          hsCode: document.getElementById('f-hsCode').value.trim(),
          unitBarcode: document.getElementById('f-unitBarcode').value.trim(),
          midBarcode: document.getElementById('f-midBarcode').value.trim(),
          cartonBarcode: document.getElementById('f-cartonBarcode').value.trim(),
          prodDate: document.getElementById('f-prodDate').value.trim(),
          ingredients: document.getElementById('f-ingredients').value.trim(),
          nutrition: document.getElementById('f-nutrition').value.trim(),
          boxQty: toNum(document.getElementById('f-boxQty').value),
          midQty: toNum(document.getElementById('f-midQty').value),
          midCount: toNum(document.getElementById('f-midCount').value),
          len: toNum(document.getElementById('f-len').value),
          width: toNum(document.getElementById('f-width').value),
          height: toNum(document.getElementById('f-height').value),
          netWeight: toNum(document.getElementById('f-netWeight').value),
          grossWeight: toNum(document.getElementById('f-grossWeight').value),
          volume: toNum(document.getElementById('f-volume').value),
          price: toNum(document.getElementById('f-price').value),
          U: toNum(document.getElementById('f-U').value),
          S: toNum(document.getElementById('f-S').value),
          T: toNum(document.getElementById('f-T').value),
          M: toNum(document.getElementById('f-M').value),
          B: toNum(document.getElementById('f-B').value),
          AZ: toNum(document.getElementById('f-AZ').value),
          total1: toNum(document.getElementById('f-total1').value),
          total2: toNum(document.getElementById('f-total2').value),
          amount: toNum(document.getElementById('f-amount').value),
          imgBg: 'var(--fto-primary-100)',
          imgFg: 'var(--fto-primary-700)'
        };

        if (editingId) {
          var rec = findById(editingId);
          if (rec) {
            data.imgBg = rec.imgBg;
            data.imgFg = rec.imgFg;
            Object.keys(rec).forEach(function (k) { delete rec[k]; });
            for (var k in data) { rec[k] = data[k]; }
          }
        } else {
          products.push(data);
        }

        closeModal();
        render();
      }

      /* ---------------- 导出 CSV（UTF-8 BOM） ---------------- */
      function csvField(v) {
        var s = String(v == null ? '' : v);
        if (/[",\r\n]/.test(s)) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }

      function exportCSV() {
        var header = ['编号', '产品图片', '产品名称', '产品名称/规格', '海关编码', '单个条码', '中包条码', '纸箱条码',
          '生产日期', '配料表', '营养成分表', '箱装数量', '中包数量', '中包数', '长', '宽', '高',
          '净重', '毛重', '体积', '价格(元/箱）', 'U', 'S', 'T', 'M', 'B', 'AZ',
          '总件数', '总件数', '金额'];

        var lines = [header.map(csvField).join(',')];
        products.forEach(function (p) {
          var row = [
            p.id, String(p.name || '').charAt(0), p.name, p.spec, p.hsCode, p.unitBarcode, p.midBarcode, p.cartonBarcode,
            p.prodDate, p.ingredients, p.nutrition, p.boxQty, p.midQty, p.midCount, p.len, p.width, p.height,
            p.netWeight, p.grossWeight, p.volume, p.price, p.U, p.S, p.T, p.M, p.B, p.AZ,
            p.total1, p.total2, p.amount
          ];
          lines.push(row.map(csvField).join(','));
        });

        var csv = '\uFEFF' + lines.join('\r\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var d = new Date();
        var ymd = d.getFullYear() +
          String(d.getMonth() + 1).padStart(2, '0') +
          String(d.getDate()).padStart(2, '0');
        a.href = url;
        a.download = 'products_' + ymd + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        alert('已导出 ' + products.length + ' 条商品记录');
      }

      /* ---------------- 导入 CSV ---------------- */
      function parseCSV(text) {
        var rows = [], row = [], field = '', inQuotes = false;
        for (var i = 0; i < text.length; i++) {
          var c = text[i];
          if (inQuotes) {
            if (c === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; }
              else { inQuotes = false; }
            } else {
              field += c;
            }
          } else {
            if (c === '"') { inQuotes = true; }
            else if (c === ',') { row.push(field); field = ''; }
            else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
            else if (c === '\r') { /* 忽略，\r\n 由 \n 统一处理 */ }
            else { field += c; }
          }
        }
        if (field !== '' || row.length) { row.push(field); rows.push(row); }
        return rows;
      }

      function mapRow(header, r) {
        function col(name) {
          var i = header.indexOf(name);
          return i > -1 ? String(r[i] || '').trim() : '';
        }
        /* 两个「总件数」列按出现顺序区分 */
        var totalIdx = [];
        header.forEach(function (h, i) { if (h === '总件数') totalIdx.push(i); });
        var total1 = totalIdx.length > 0 ? String(r[totalIdx[0]] || '').trim() : '';
        var total2 = totalIdx.length > 1 ? String(r[totalIdx[1]] || '').trim() : '';

        return {
          id: col('编号') || '',
          name: col('产品名称'),
          spec: col('产品名称/规格'),
          hsCode: col('海关编码'),
          unitBarcode: col('单个条码'),
          midBarcode: col('中包条码'),
          cartonBarcode: col('纸箱条码'),
          prodDate: col('生产日期'),
          ingredients: col('配料表'),
          nutrition: col('营养成分表'),
          boxQty: toNum(col('箱装数量')),
          midQty: toNum(col('中包数量')),
          midCount: toNum(col('中包数')),
          len: toNum(col('长')),
          width: toNum(col('宽')),
          height: toNum(col('高')),
          netWeight: toNum(col('净重')),
          grossWeight: toNum(col('毛重')),
          volume: toNum(col('体积')),
          price: toNum(col('价格(元/箱）')),
          U: toNum(col('U')), S: toNum(col('S')), T: toNum(col('T')),
          M: toNum(col('M')), B: toNum(col('B')), AZ: toNum(col('AZ')),
          total1: toNum(total1),
          total2: toNum(total2),
          amount: toNum(col('金额')),
          imgBg: 'var(--fto-primary-100)',
          imgFg: 'var(--fto-primary-700)'
        };
      }

      function importCSV(file) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var text = String(e.target.result || '').replace(/^\uFEFF/, '');
          if (!text.trim()) {
            alert('文件内容为空，未能解析出数据');
            return;
          }
          try {
            var rows = parseCSV(text);
            if (!rows.length) {
              alert('未能从文件中解析出数据，请检查文件格式');
              return;
            }
            var header = rows[0].map(function (h) { return String(h || '').trim(); });
            var dataRows = rows.slice(1).filter(function (r) {
              return r.some(function (c) { return String(c || '').trim() !== ''; });
            });
            if (!dataRows.length) {
              alert('未能从文件中解析出数据，请检查文件格式');
              return;
            }
            var count = 0;
            dataRows.forEach(function (r) {
              var obj = mapRow(header, r);
              if (!obj.name && !obj.spec) return;
              if (!obj.id) obj.id = nextId();
              products.push(obj);
              count++;
            });
            if (count > 0) {
              render();
              alert('成功导入 ' + count + ' 条记录');
            } else {
              alert('未能从文件中解析出数据，请检查文件格式');
            }
          } catch (err) {
            alert('文件格式无法解析：' + (err && err.message ? err.message : '未知错误'));
          }
        };
        reader.onerror = function () {
          alert('文件读取失败，请重试');
        };
        reader.readAsText(file);
      }

      /* ---------------- 事件绑定 ---------------- */
      btnAdd.addEventListener('click', function () {
        openModal(null);
      });

      btnExport.addEventListener('click', function () {
        exportCSV();
      });

      btnImport.addEventListener('click', function () {
        importFile.click();
      });

      importFile.addEventListener('change', function () {
        var file = importFile.files && importFile.files[0];
        if (file) {
          importCSV(file);
        }
        importFile.value = '';
      });

      searchInput.addEventListener('input', function () {
        render();
      });

      tbody.addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        if (btn.classList.contains('row-view')) {
          var rec = findById(id);
          if (rec) openDetail(rec);
        } else if (btn.classList.contains('row-edit')) {
          var rec2 = findById(id);
          if (rec2) openModal(rec2);
        } else if (btn.classList.contains('row-del')) {
          if (confirm('确定删除该商品（' + id + '）吗？')) {
            for (var i = 0; i < products.length; i++) {
              if (products[i].id === id) {
                products.splice(i, 1);
                break;
              }
            }
            render();
          }
        }
      });

      modalClose.addEventListener('click', closeModal);
      modalCancel.addEventListener('click', closeModal);
      modalSave.addEventListener('click', saveRecord);

      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });

      detailClose.addEventListener('click', closeDetail);
      detailCloseBtn.addEventListener('click', closeDetail);

      detailOverlay.addEventListener('click', function (e) {
        if (e.target === detailOverlay) closeDetail();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (!detailOverlay.classList.contains('hidden')) {
            closeDetail();
          } else if (!overlay.classList.contains('hidden')) {
            closeModal();
          }
        }
      });

      /* ---------------- 初始化 ---------------- */
      render();
    })();
  </script>

</body>
