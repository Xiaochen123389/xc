    <style id="theme-vars">
/* Foreign Trade Order & Inventory Management System — Brand Tokens */

:root {
  /* Primary scale — Indigo (professional B2B admin) */
  --fto-primary-50: #eef2ff;
  --fto-primary-100: #e0e7ff;
  --fto-primary-200: #c7d2fe;
  --fto-primary-300: #a5b4fc;
  --fto-primary-400: #818cf8;
  --fto-primary-500: #6366f1;
  --fto-primary-600: #4f46e5;
  --fto-primary-700: #4338ca;
  --fto-primary-800: #3730a3;
  --fto-primary-900: #312e81;

  /* Neutral scale — Slate */
  --fto-slate-50: #f8fafc;
  --fto-slate-100: #f1f5f9;
  --fto-slate-200: #e2e8f0;
  --fto-slate-300: #cbd5e1;
  --fto-slate-400: #94a3b8;
  --fto-slate-500: #64748b;
  --fto-slate-600: #475569;
  --fto-slate-700: #334155;
  --fto-slate-800: #1e293b;
  --fto-slate-900: #0f172a;

  /* Semantic aliases */
  --fto-background: #ffffff;
  --fto-foreground: #0f172a;
  --fto-card: #ffffff;
  --fto-card-foreground: #0f172a;
  --fto-popover: #ffffff;
  --fto-popover-foreground: #0f172a;
  --fto-primary: #4f46e5;
  --fto-primary-foreground: #ffffff;
  --fto-secondary: #f1f5f9;
  --fto-secondary-foreground: #334155;
  --fto-muted: #f1f5f9;
  --fto-muted-foreground: #64748b;
  --fto-accent: #eef2ff;
  --fto-accent-foreground: #4338ca;
  --fto-border: #e2e8f0;
  --fto-input: #e2e8f0;
  --fto-ring: #4f46e5;

  /* State colors */
  --fto-state-success: #16a34a;
  --fto-state-success-bg: #dcfce7;
  --fto-state-warning: #d97706;
  --fto-state-warning-bg: #fef3c7;
  --fto-state-error: #dc2626;
  --fto-state-error-bg: #fee2e2;
  --fto-state-info: #2563eb;
  --fto-state-info-bg: #dbeafe;

  /* Surface/depth */
  --fto-surface: #ffffff;
  --fto-surface-2: #f8fafc;
  --fto-surface-3: #f1f5f9;
  --fto-ink: #0f172a;
  --fto-ink-2: #475569;
  --fto-ink-3: #94a3b8;
  --fto-line: #e2e8f0;

  /* Radius */
  --fto-radius-small: 4px;
  --fto-radius-medium: 8px;
  --fto-radius-large: 12px;
  --fto-radius-full: 9999px;

  /* Shadows */
  --fto-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --fto-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --fto-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* Typography */
  --fto-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --fto-font-mono: "SF Mono", "Fira Code", "Noto Sans Mono", monospace;
}

.dark {
  --fto-background: #0b0b0f;
  --fto-foreground: #f8fafc;
  --fto-card: #14141a;
  --fto-card-foreground: #f8fafc;
  --fto-popover: #14141a;
  --fto-popover-foreground: #f8fafc;
  --fto-primary: #6366f1;
  --fto-primary-foreground: #ffffff;
  --fto-secondary: #1e293b;
  --fto-secondary-foreground: #cbd5e1;
  --fto-muted: #1e293b;
  --fto-muted-foreground: #94a3b8;
  --fto-accent: #312e81;
  --fto-accent-foreground: #c7d2fe;
  --fto-border: #334155;
  --fto-input: #334155;
  --fto-ring: #6366f1;
  --fto-surface: #14141a;
  --fto-surface-2: #1e293b;
  --fto-surface-3: #0f172a;
  --fto-ink: #f8fafc;
  --fto-ink-2: #cbd5e1;
  --fto-ink-3: #64748b;
  --fto-line: #334155;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body class="min-h-screen font-sans antialiased">

  <!-- Sidebar -->
  <aside
    class="fixed top-0 left-0 bottom-0 z-40 flex flex-col"
    style="width: var(--shell-sidebar-width); background-color: var(--fto-surface-2); border-right: 1px solid var(--fto-line);"
  >
    <!-- Logo / App Name -->
    <div
      class="flex h-[64px] items-center gap-3 px-6"
      style="border-bottom: 1px solid var(--fto-line);"
    >
      <i data-lucide="package" class="h-6 w-6" style="color: var(--fto-primary);"></i>
      <span class="text-base font-semibold" style="color: var(--fto-ink);">外贸订单与库存一体化管理系统</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 py-4">
      <ul class="flex flex-col gap-1">
        <li>
          <a
            href="products-v4.html"
            data-nav-key="products"
            data-dom-id="nav-products"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="package" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>商品总表</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-management.html"
            data-nav-key="supplier-management"
            data-dom-id="nav-supplier-management"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="factory" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>供应商管理</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-orders-v2.html"
            data-nav-key="supplier-orders"
            data-dom-id="nav-supplier-orders"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="truck" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>订单汇总/供应商订货</span>
          </a>
        </li>
        <li>
          <a
            href="warehouse-inbound-v3.html"
            data-nav-key="warehouse-inbound"
            data-dom-id="nav-warehouse-inbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="background-color: var(--fto-accent); color: var(--fto-accent-foreground);"
          >
            <i data-lucide="scan-barcode" class="h-5 w-5"></i>
            <span>入库管理</span>
          </a>
        </li>
        <li>
          <a
            href="inventory-v2.html"
            data-nav-key="inventory"
            data-dom-id="nav-inventory"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="warehouse" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>库存查询</span>
          </a>
        </li>
        <li>
          <a
            href="outbound.html"
            data-nav-key="outbound"
            data-dom-id="nav-outbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="arrow-right-from-line" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>出库管理</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Top Toolbar -->
  <header
    class="fixed top-0 right-0 z-30 flex items-center justify-between px-6"
    style="left: var(--shell-sidebar-width); height: var(--shell-toolbar-height); background-color: var(--fto-surface); border-bottom: 1px solid var(--fto-line);"
  >
    <div class="flex items-center gap-4">
      <button type="button" class="rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
      <h1 class="text-lg font-semibold" style="color: var(--fto-ink);">仓库入库 - 同步版</h1>
    </div>

    <div class="flex items-center gap-4">
      <!-- Global Search -->
      <div class="relative hidden sm:block">
        <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
        <input
          type="text"
          placeholder="全局搜索..."
          class="h-9 w-64 rounded-lg pl-9 pr-3 text-sm outline-none focus:ring-2"
          style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
        />
      </div>

      <!-- Notifications -->
      <button type="button" class="relative rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="bell" class="h-5 w-5"></i>
        <span
          class="absolute right-1.5 top-1.5 flex h-4 min-w-[16px] items-center justify-center rounded-full px-1 text-[10px] font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >3</span>
      </button>

      <!-- User -->
      <div class="flex items-center gap-3">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >管</div>
        <span class="hidden text-sm font-medium md:block" style="color: var(--fto-ink);">管理员</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main
    class="min-h-screen"
    style="margin-left: var(--shell-sidebar-width); padding-top: var(--shell-toolbar-height); background-color: var(--fto-background);"
  >
    <div class="p-6">
      <div
        class="rounded-xl p-6"
        style="background-color: var(--fto-card); border: 1px solid var(--fto-line); border-radius: var(--fto-radius-large); box-shadow: var(--fto-shadow-1);"
      >
        <!-- 顶部说明行 -->
        <div class="mb-6 flex items-center gap-2 text-sm font-medium" style="color: var(--fto-ink-2);">
          <i data-lucide="scan-barcode" class="h-4 w-4" style="color: var(--fto-primary-600);"></i>
          <span>扫码入库 · 供应商到货收货 · 自动同步库存</span>
        </div>

        <!-- SLOT: mainContent -->
        <div class="space-y-6">

          <!-- 同步信息横幅（info 风格） -->
          <div
            class="flex items-center gap-2.5 rounded-lg px-4 py-3 text-sm font-medium"
            style="background-color: var(--fto-state-info-bg); border: 1px solid var(--fto-state-info); color: var(--fto-state-info);"
          >
            <i data-lucide="refresh-cw" class="h-4 w-4 shrink-0"></i>
            <span>入库记录将自动同步至库存查询模块</span>
          </div>

          <!-- 已同步汇总（页面加载时按需显示） -->
          <div id="syncSummary"
            class="hidden items-center gap-2 rounded-lg px-4 py-2 text-xs font-medium"
            style="background-color: var(--fto-accent); border: 1px solid var(--fto-primary-100); color: var(--fto-accent-foreground);"
          >
            <i data-lucide="link" class="h-3.5 w-3.5"></i>
            <span></span>
          </div>

          <!-- 顶部大号扫码输入区 -->
          <section
            class="rounded-xl p-6"
            style="background-color: var(--fto-surface-2); border: 1px dashed var(--fto-primary-300); border-radius: var(--fto-radius-large);"
          >
            <div class="mb-3 flex items-center gap-2 text-base font-semibold" style="color: var(--fto-primary-700);">
              <i data-lucide="scan-barcode" class="h-5 w-5"></i>
              <span>扫码入库</span>
            </div>
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
              <div class="relative flex-1">
                <i data-lucide="scan-line" class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
                <input
                  id="barcodeInput"
                  type="text"
                  placeholder="请扫描或输入产品条码"
                  autocomplete="off"
                  class="h-14 w-full rounded-lg pl-12 pr-4 text-base outline-none focus:ring-2"
                  style="background-color: var(--fto-card); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
                />
              </div>
              <button id="scanSubmitBtn" type="button"
                class="inline-flex h-14 items-center gap-2 rounded-lg px-6 text-base font-semibold transition-colors hover:opacity-90"
                style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
              >
                <i data-lucide="arrow-down-to-line" class="h-5 w-5"></i>
                <span>确认入库</span>
              </button>
            </div>
            <p class="mt-3 text-sm" style="color: var(--fto-ink-3);">扫描产品条码后按回车或点击「确认入库」，核对实收数量后完成入库</p>
          </section>

          <!-- 中间到货进度卡片区 -->
          <section>
            <h2 class="mb-3 text-sm font-semibold" style="color: var(--fto-ink);">到货进度</h2>
            <div id="progressCards" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <!-- JS 填充 -->
            </div>
          </section>

          <!-- 下部已入库记录表 -->
          <section>
            <div class="mb-3 flex items-center justify-between">
              <h2 class="text-sm font-semibold" style="color: var(--fto-ink);">已入库记录</h2>
              <span id="recordsCountBadge"
                class="rounded-full px-2.5 py-0.5 text-xs font-medium"
                style="background-color: var(--fto-primary-100); color: var(--fto-primary-700);"
              >已入库 0 条</span>
            </div>
            <div class="overflow-x-auto rounded-xl" style="border: 1px solid var(--fto-line);">
              <table class="w-full text-sm">
                <thead style="background-color: var(--fto-surface-2);">
                  <tr>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">序号</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">纸箱条码</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">产品名称</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">SKU 编号</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">实收/应收</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">入库时间</th>
                    <th class="px-4 py-3 text-center font-medium" style="color: var(--fto-ink-2);">操作</th>
                  </tr>
                </thead>
                <tbody id="recordsBody" style="background-color: var(--fto-card);">
                  <!-- JS 填充 -->
                </tbody>
              </table>
            </div>
          </section>

        </div>
        <!-- /SLOT: mainContent -->
      </div>
    </div>
  </main>

  <!-- 扫码入库确认弹窗 -->
  <div id="scanModalOverlay" class="modal-overlay hidden">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="scanModalTitle">
      <div class="flex items-start justify-between gap-4">
        <h3 id="scanModalTitle" class="text-base font-semibold" style="color: var(--fto-ink);">产品入库确认</h3>
        <button id="scanModalCloseBtn" type="button" class="rounded-md p-1 transition-colors hover:opacity-80" style="color: var(--fto-ink-3);">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <!-- 产品信息 -->
      <div class="mt-4 rounded-lg px-4 py-3" style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-line);">
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-0.5">
          <span id="scanModalProductName" class="text-lg font-semibold" style="color: var(--fto-ink);"></span>
          <span id="scanModalProductSku" class="font-mono text-sm" style="color: var(--fto-primary-600);"></span>
        </div>
        <div class="mt-1 text-xs" style="color: var(--fto-ink-3);">
          条码：<span id="scanModalBarcode" class="font-mono"></span>
        </div>
      </div>

      <!-- 应收 / 实收 -->
      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium" style="color: var(--fto-ink-2);">应收件数</label>
          <div id="scanModalExpected"
            class="flex h-11 items-center rounded-lg px-3 text-sm font-semibold"
            style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-line); color: var(--fto-ink);"
          ></div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium" style="color: var(--fto-ink-2);">实收件数</label>
          <input id="scanModalReceived" type="number" min="1" step="1"
            class="h-11 w-full rounded-lg px-3 text-sm outline-none focus:ring-2"
            style="background-color: var(--fto-card); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
          />
        </div>
      </div>
      <p id="scanModalError" class="mt-2 hidden text-xs" style="color: var(--fto-state-error);"></p>

      <div class="mt-6 flex items-center justify-end gap-3">
        <button id="scanModalCancelBtn" type="button"
          class="inline-flex h-9 items-center rounded-lg px-4 text-sm font-medium transition-colors hover:opacity-80"
          style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink-2);"
        >取消</button>
        <button id="scanModalConfirmBtn" type="button"
          class="inline-flex h-9 items-center gap-2 rounded-lg px-4 text-sm font-medium transition-colors hover:opacity-90"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >
          <i data-lucide="check" class="h-4 w-4"></i>
          <span>确认入库</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 轻提示 Toast -->
  <div id="scanToast" class="toast hidden"></div>

  <style>
    :root {
      --shell-sidebar-width: 240px;
      --shell-toolbar-height: 64px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [data-icon] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-color: currentColor;
    }
    /* 弹窗遮罩与对话框 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background-color: color-mix(in srgb, var(--fto-slate-900) 45%, transparent);
    }
    .modal-overlay.hidden { display: none; }
    .modal-dialog {
      width: 100%;
      max-width: 460px;
      border-radius: var(--fto-radius-large);
      background-color: var(--fto-card);
      border: 1px solid var(--fto-line);
      box-shadow: var(--fto-shadow-3);
      padding: 1.5rem;
    }
    /* 轻提示 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 2.5rem;
      z-index: 80;
      transform: translateX(-50%);
      border-radius: var(--fto-radius-medium);
      background-color: var(--fto-slate-800);
      color: var(--fto-slate-50);
      padding: 0.625rem 1rem;
      font-size: 0.8125rem;
      box-shadow: var(--fto-shadow-2);
    }
    .toast.hidden { display: none; }
    /* 已同步汇总条（flex 显示开关） */
    #syncSummary.flex { display: flex; }
  </style>

  <script>
    (function () {
      // ===== 共享同步存储（localStorage -> 内存降级） =====
      var SYNC_KEY = 'fto_inbound_sync';
      var syncMemoryStore = []; // localStorage 不可用时的内存降级

      function loadSyncRecords() {
        try {
          var raw = window.localStorage.getItem(SYNC_KEY);
          if (raw) {
            var arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
          }
        } catch (err) {
          // 预览环境（如 iframe srcdoc）下 localStorage 不可用，降级为内存数组
        }
        return syncMemoryStore;
      }

      function saveSyncRecords(arr) {
        syncMemoryStore = arr;
        try {
          window.localStorage.setItem(SYNC_KEY, JSON.stringify(arr));
        } catch (err) {
          // localStorage 写入失败时静默降级为内存数组，不影响页面功能
        }
      }

      // ===== 数据模型 =====
      var skuMap = {
        'SKU-1001': { name: '纯棉T恤 XL', expected: 800, received: 790, lastInbound: '2026-08-25 09:15:07' },
        'SKU-1002': { name: '尼龙运动背包', expected: 500, received: 500, lastInbound: '2026-08-25 09:28:19' },
        'SKU-1003': { name: '不锈钢保温杯', expected: 1200, received: 560, lastInbound: '2026-08-25 10:02:44' },
        'SKU-1004': { name: '蓝牙无线耳机', expected: 300, received: 300, lastInbound: '2026-08-25 10:11:58' }
      };

      // 记录：qty = 本次确认的实收件数，prev = 确认前该产品已收数量（用于撤销回滚）
      var records = [
        { id: 1, barcode: 'BOX-20260825-0001', sku: 'SKU-1001', qty: 780, prev: 770, time: '2026-08-25 09:12:33' },
        { id: 2, barcode: 'BOX-20260825-0002', sku: 'SKU-1001', qty: 790, prev: 780, time: '2026-08-25 09:15:07' },
        { id: 3, barcode: 'BOX-20260825-0041', sku: 'SKU-1002', qty: 500, prev: 480, time: '2026-08-25 09:28:19' },
        { id: 4, barcode: 'BOX-20260825-0105', sku: 'SKU-1003', qty: 560, prev: 540, time: '2026-08-25 10:02:44' },
        { id: 5, barcode: 'BOX-20260825-0200', sku: 'SKU-1004', qty: 300, prev: 280, time: '2026-08-25 10:11:58' }
      ];

      // ===== DOM 引用 =====
      var barcodeInput = document.getElementById('barcodeInput');
      var scanSubmitBtn = document.getElementById('scanSubmitBtn');
      var progressCards = document.getElementById('progressCards');
      var recordsBody = document.getElementById('recordsBody');
      var recordsCountBadge = document.getElementById('recordsCountBadge');
      var syncSummary = document.getElementById('syncSummary');

      var modalOverlay = document.getElementById('scanModalOverlay');
      var modalProductName = document.getElementById('scanModalProductName');
      var modalProductSku = document.getElementById('scanModalProductSku');
      var modalBarcode = document.getElementById('scanModalBarcode');
      var modalExpected = document.getElementById('scanModalExpected');
      var modalReceived = document.getElementById('scanModalReceived');
      var modalError = document.getElementById('scanModalError');
      var modalConfirmBtn = document.getElementById('scanModalConfirmBtn');
      var modalCancelBtn = document.getElementById('scanModalCancelBtn');
      var modalCloseBtn = document.getElementById('scanModalCloseBtn');
      var toast = document.getElementById('scanToast');

      var pendingSku = null; // 当前弹窗对应的 SKU

      // ===== 工具函数 =====
      function formatNow() {
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('hidden');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () {
          toast.classList.add('hidden');
        }, 2600);
      }

      function renderSyncSummary() {
        var count = loadSyncRecords().length;
        if (count > 0) {
          syncSummary.querySelector('span').textContent = '已同步 ' + count + ' 个产品入库记录';
          syncSummary.classList.add('flex');
          syncSummary.classList.remove('hidden');
        } else {
          syncSummary.classList.remove('flex');
          syncSummary.classList.add('hidden');
        }
      }

      // 条码 -> SKU 映射：BOX-20260825-0001~0040 → SKU-1001；0041~0100 → SKU-1002；0101~0200 → SKU-1003；0201 以上 → SKU-1004
      function resolveSku(barcode) {
        var value = (barcode || '').trim();
        var m = value.match(/^BOX-20260825-(\d+)$/);
        if (!m) return null;
        var n = parseInt(m[1], 10);
        if (n <= 40) return 'SKU-1001';
        if (n <= 100) return 'SKU-1002';
        if (n <= 200) return 'SKU-1003';
        return 'SKU-1004';
      }

      // ===== 弹窗控制 =====
      function openModal(sku, barcode) {
        var info = skuMap[sku];
        pendingSku = sku;
        modalProductName.textContent = info.name;
        modalProductSku.textContent = sku;
        modalBarcode.textContent = barcode;
        modalExpected.textContent = info.expected + ' 件';
        modalReceived.value = info.expected;
        modalReceived.min = 1;
        modalError.classList.add('hidden');
        modalOverlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        setTimeout(function () { modalReceived.focus(); }, 30);
      }

      function closeModal() {
        modalOverlay.classList.add('hidden');
        pendingSku = null;
        document.body.style.overflow = '';
      }

      // ===== 渲染 =====
      function statusOf(info) {
        if (info.received >= info.expected) {
          return { text: '已收齐', bg: 'var(--fto-state-success-bg)', fg: 'var(--fto-state-success)' };
        }
        if (info.received <= 0) {
          return { text: '欠交', bg: 'var(--fto-state-error-bg)', fg: 'var(--fto-state-error)' };
        }
        return { text: '部分到货', bg: 'var(--fto-state-warning-bg)', fg: 'var(--fto-state-warning)' };
      }

      function renderProgressCards() {
        progressCards.innerHTML = '';
        Object.keys(skuMap).forEach(function (sku) {
          var info = skuMap[sku];
          var pct = Math.min(100, Math.round((info.received / info.expected) * 100));
          var complete = info.received >= info.expected;
          var st = statusOf(info);
          var barColor = complete ? 'var(--fto-state-success)' : 'var(--fto-primary)';

          var card = document.createElement('div');
          card.className = 'rounded-lg p-4';
          card.style.backgroundColor = 'var(--fto-card)';
          card.style.border = '1px solid var(--fto-line)';
          card.innerHTML =
            '<div class="flex items-start justify-between gap-2">' +
              '<div class="min-w-0">' +
                '<div class="truncate text-sm font-semibold" style="color: var(--fto-ink);">' + info.name + '</div>' +
                '<div class="mt-0.5 font-mono text-xs" style="color: var(--fto-ink-3);">' + sku + '</div>' +
              '</div>' +
              '<span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium" style="background-color: ' + st.bg + '; color: ' + st.fg + ';">' + st.text + '</span>' +
            '</div>' +
            '<div class="mt-4 text-xs" style="color: var(--fto-ink-3);">实收 / 应收</div>' +
            '<div class="flex items-end gap-1">' +
              '<span class="text-2xl font-bold leading-none" style="color: var(--fto-primary);">' + info.received + '</span>' +
              '<span class="mb-0.5 text-sm leading-none" style="color: var(--fto-ink-3);">/ ' + info.expected + '</span>' +
              '<span class="mb-0.5 ml-auto text-xs" style="color: var(--fto-ink-3);">' + pct + '%</span>' +
            '</div>' +
            '<div class="mt-2 h-2 w-full overflow-hidden rounded-full" style="background-color: var(--fto-surface-3);">' +
              '<div class="h-2 rounded-full transition-all duration-300" style="width: ' + pct + '%; background-color: ' + barColor + ';"></div>' +
            '</div>' +
            '<div class="mt-3 text-xs" style="color: var(--fto-ink-3);">最近入库：' + (info.lastInbound || '—') + '</div>';
          progressCards.appendChild(card);
        });
      }

      function renderRecords() {
        recordsBody.innerHTML = '';
        records.slice().reverse().forEach(function (record, idx) {
          var info = skuMap[record.sku] || {};
          var row = document.createElement('tr');
          row.style.borderTop = '1px solid var(--fto-line)';
          row.innerHTML =
            '<td class="px-4 py-3" style="color: var(--fto-ink-2);">' + (records.length - idx) + '</td>' +
            '<td class="px-4 py-3 font-mono text-xs" style="color: var(--fto-ink);">' + record.barcode + '</td>' +
            '<td class="px-4 py-3" style="color: var(--fto-ink);">' + (info.name || record.sku) + '</td>' +
            '<td class="px-4 py-3 font-mono text-xs" style="color: var(--fto-ink-2);">' + record.sku + '</td>' +
            '<td class="px-4 py-3" style="color: var(--fto-ink);">' + record.qty + '<span style="color: var(--fto-ink-3);"> / ' + (info.expected || '-') + '</span></td>' +
            '<td class="whitespace-nowrap px-4 py-3" style="color: var(--fto-ink-2);">' + record.time + '</td>' +
            '<td class="px-4 py-3 text-center">' +
              '<button type="button" data-record-id="' + record.id + '"' +
                ' class="record-undo inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium transition-colors hover:opacity-80"' +
                ' style="background-color: var(--fto-state-error-bg); color: var(--fto-state-error);">' +
                '<i data-lucide="rotate-ccw" class="h-3 w-3"></i>' +
                '<span>撤销</span>' +
              '</button>' +
            '</td>';
          recordsBody.appendChild(row);
        });
        recordsCountBadge.textContent = '已入库 ' + records.length + ' 条';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      // ===== 共享同步存储（合并/覆盖） =====
      function syncRecordFor(sku, info, barcode) {
        return {
          sku: sku,
          productName: info.name,
          expected: info.expected,
          received: info.received,
          barcode: barcode || '',
          inboundTime: info.lastInbound || ''
        };
      }

      // 页面加载时：用共享存储覆盖/合并 skuMap（保持刷新后状态一致）
      function mergeSyncedState() {
        var arr = loadSyncRecords();
        var merged = 0;
        arr.forEach(function (rec) {
          if (!rec || !rec.sku) return;
          var received = parseInt(rec.received, 10);
          if (skuMap[rec.sku]) {
            var info = skuMap[rec.sku];
            if (!isNaN(received) && received >= 0) {
              info.received = received;
              merged++;
            }
            if (rec.inboundTime) info.lastInbound = rec.inboundTime;
          } else if (rec.productName) {
            skuMap[rec.sku] = {
              name: rec.productName,
              expected: parseInt(rec.expected, 10) || 0,
              received: isNaN(received) ? 0 : received,
              lastInbound: rec.inboundTime || ''
            };
            merged++;
          }
        });
        return merged;
      }

      // ===== 入库流程 =====
      function tryScan() {
        var value = (barcodeInput.value || '').trim();
        if (!value) {
          showToast('请扫描或输入产品条码');
          barcodeInput.focus();
          return;
        }
        var sku = resolveSku(value);
        if (!sku || !skuMap[sku]) {
          showToast('未找到对应产品');
          barcodeInput.select();
          return;
        }
        openModal(sku, value);
      }

      function confirmInbound() {
        if (!pendingSku) return;
        var qty = parseInt(modalReceived.value, 10);
        if (isNaN(qty) || qty <= 0) {
          modalError.textContent = '实收件数必须大于 0';
          modalError.classList.remove('hidden');
          return;
        }
        var info = skuMap[pendingSku];
        var prev = info.received;
        info.received = qty;
        info.lastInbound = formatNow();
        var barcode = (barcodeInput.value || '').trim();
        records.push({
          id: Date.now(),
          barcode: barcode,
          sku: pendingSku,
          qty: qty,
          prev: prev,
          time: info.lastInbound
        });

        // 写入共享同步存储（同一 SKU 覆盖，保留最近入库时间）
        var synced = loadSyncRecords();
        var rec = syncRecordFor(pendingSku, info, barcode);
        var idx = -1;
        for (var i = 0; i < synced.length; i++) {
          if (synced[i] && synced[i].sku === pendingSku) { idx = i; break; }
        }
        if (idx >= 0) {
          synced[idx] = rec;
        } else {
          synced.push(rec);
        }
        saveSyncRecords(synced);

        renderProgressCards();
        renderRecords();
        renderSyncSummary();
        closeModal();
        barcodeInput.value = '';
        barcodeInput.focus();
        showToast('已入库并同步至库存查询');
      }

      function undoInbound(recordId) {
        var idx = -1;
        for (var i = 0; i < records.length; i++) {
          if (records[i].id === recordId) { idx = i; break; }
        }
        if (idx === -1) return;
        var record = records[idx];
        var info = skuMap[record.sku];
        if (info) {
          info.received = Math.max(0, record.prev || 0);
        }
        records.splice(idx, 1);

        // 撤销后同步更新共享存储（重写删除该条后的数据）
        try {
          var synced = loadSyncRecords().filter(function (r) { return !r || r.sku !== record.sku; });
          if (info) {
            synced.push(syncRecordFor(record.sku, info, record.barcode));
          }
          saveSyncRecords(synced);
        } catch (err) {
          // 同步失败不影响本地撤销
        }

        renderProgressCards();
        renderRecords();
        renderSyncSummary();
        showToast('已撤销，同步记录已更新');
      }

      // ===== 事件绑定 =====
      barcodeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          tryScan();
        }
      });

      scanSubmitBtn.addEventListener('click', function () {
        tryScan();
      });

      modalConfirmBtn.addEventListener('click', confirmInbound);

      modalCancelBtn.addEventListener('click', closeModal);
      modalCloseBtn.addEventListener('click', closeModal);

      modalReceived.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmInbound();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeModal();
        }
      });

      // 点击遮罩关闭
      modalOverlay.addEventListener('click', function (e) {
        if (e.target === modalOverlay) closeModal();
      });

      // Esc 关闭弹窗
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) {
          closeModal();
        }
      });

      // 记录表撤销（事件委托）
      recordsBody.addEventListener('click', function (e) {
        var btn = e.target.closest('.record-undo');
        if (btn) {
          undoInbound(Number(btn.dataset.recordId));
        }
      });

      // ===== 初始化 =====
      var syncedCount = mergeSyncedState();
      renderProgressCards();
      renderRecords();
      renderSyncSummary();
      barcodeInput.focus();
      if (typeof lucide !== 'undefined') lucide.createIcons();
      if (syncedCount > 0) {
        showToast('已同步 ' + syncedCount + ' 个产品入库记录');
      }
    })();
  </script>
</body>
</html>
