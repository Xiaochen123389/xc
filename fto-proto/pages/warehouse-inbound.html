    <style id="theme-vars">
/* Foreign Trade Order & Inventory Management System — Brand Tokens */

:root {

  --fto-primary-600: #4f46e5;
  --fto-primary-700: #4338ca;
  --fto-primary-800: #3730a3;
  --fto-primary-900: #312e81;

  /* Neutral scale — Slate */
  --fto-slate-50: #f8fafc;
  --fto-slate-100: #f1f5f9;
  --fto-slate-200: #e2e8f0;
  --fto-slate-300: #cbd5e1;
  --fto-slate-400: #94a3b8;
  --fto-slate-500: #64748b;
  --fto-slate-600: #475569;
  --fto-slate-700: #334155;
  --fto-slate-800: #1e293b;
  --fto-slate-900: #0f172a;

  /* Semantic aliases */
  --fto-background: #ffffff;
  --fto-foreground: #0f172a;
  --fto-card: #ffffff;
  --fto-card-foreground: #0f172a;
  --fto-popover: #ffffff;
  --fto-popover-foreground: #0f172a;
  --fto-primary: #4f46e5;
  --fto-primary-foreground: #ffffff;
  --fto-secondary: #f1f5f9;
  --fto-secondary-foreground: #334155;
  --fto-muted: #f1f5f9;
  --fto-muted-foreground: #64748b;
  --fto-accent: #eef2ff;
  --fto-accent-foreground: #4338ca;
  --fto-border: #e2e8f0;
  --fto-input: #e2e8f0;
  --fto-ring: #4f46e5;

  /* State colors */
  --fto-state-success: #16a34a;
  --fto-state-success-bg: #dcfce7;
  --fto-state-warning: #d97706;
  --fto-state-warning-bg: #fef3c7;
  --fto-state-error: #dc2626;
  --fto-state-error-bg: #fee2e2;
  --fto-state-info: #2563eb;
  --fto-state-info-bg: #dbeafe;

  /* Surface/depth */
  --fto-surface: #ffffff;
  --fto-surface-2: #f8fafc;
  --fto-surface-3: #f1f5f9;
  --fto-ink: #0f172a;
  --fto-ink-2: #475569;
  --fto-ink-3: #94a3b8;
  --fto-line: #e2e8f0;

  /* Radius */
  --fto-radius-small: 4px;
  --fto-radius-medium: 8px;
  --fto-radius-large: 12px;
  --fto-radius-full: 9999px;

  /* Shadows */
  --fto-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --fto-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --fto-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* Typography */
  --fto-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --fto-font-mono: "SF Mono", "Fira Code", "Noto Sans Mono", monospace;
}

.dark {
  --fto-background: #0b0b0f;
  --fto-foreground: #f8fafc;
  --fto-card: #14141a;
  --fto-card-foreground: #f8fafc;
  --fto-popover: #14141a;
  --fto-popover-foreground: #f8fafc;
  --fto-primary: #6366f1;
  --fto-primary-foreground: #ffffff;
  --fto-secondary: #1e293b;
  --fto-secondary-foreground: #cbd5e1;
  --fto-muted: #1e293b;
  --fto-muted-foreground: #94a3b8;
  --fto-accent: #312e81;
  --fto-accent-foreground: #c7d2fe;
  --fto-border: #334155;
  --fto-input: #334155;
  --fto-ring: #6366f1;
  --fto-surface: #14141a;
  --fto-surface-2: #1e293b;
  --fto-surface-3: #0f172a;
  --fto-ink: #f8fafc;
  --fto-ink-2: #cbd5e1;
  --fto-ink-3: #64748b;
  --fto-line: #334155;
}

    </style>

<body class="min-h-screen font-sans antialiased">

  <!-- Sidebar -->
  <aside
    class="fixed top-0 left-0 bottom-0 z-40 flex flex-col"
    style="width: var(--shell-sidebar-width); background-color: var(--fto-surface-2); border-right: 1px solid var(--fto-line);"
  >
    <!-- Logo / App Name -->
    <div
      class="flex h-[64px] items-center gap-3 px-6"
      style="border-bottom: 1px solid var(--fto-line);"
    >
      <i data-lucide="package" class="h-6 w-6" style="color: var(--fto-primary);"></i>
      <span class="text-base font-semibold" style="color: var(--fto-ink);">外贸订单与库存一体化管理系统</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 py-4">
      <ul class="flex flex-col gap-1">
        <li>
          <a
            href="products-v4.html"
            data-nav-key="products"
            data-dom-id="nav-products"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="package" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>商品总表</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-management.html"
            data-nav-key="supplier-management"
            data-dom-id="nav-supplier-management"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="factory" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>供应商管理</span>
          </a>
        </li>
        <li>
          <a
            href="supplier-orders-v2.html"
            data-nav-key="supplier-orders"
            data-dom-id="nav-supplier-orders"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="truck" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>订单汇总/供应商订货</span>
          </a>
        </li>
        <li>
          <a
            href="warehouse-inbound.html"
            data-nav-key="warehouse-inbound"
            data-dom-id="nav-warehouse-inbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="background-color: var(--fto-accent); color: var(--fto-accent-foreground);"
          >
            <i data-lucide="scan-barcode" class="h-5 w-5" ></i>
            <span>入库管理</span>
          </a>
        </li>
        <li>
          <a
            href="inventory.html"
            data-nav-key="inventory"
            data-dom-id="nav-inventory"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="warehouse" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>库存查询</span>
          </a>
        </li>
        <li>
          <a
            href="outbound.html"
            data-nav-key="outbound"
            data-dom-id="nav-outbound"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:opacity-80"
            style="color: var(--fto-ink-2);"
          >
            <i data-lucide="arrow-right-from-line" class="h-5 w-5" style="color: var(--fto-ink-3);"></i>
            <span>出库管理</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Top Toolbar -->
  <header
    class="fixed top-0 right-0 z-30 flex items-center justify-between px-6"
    style="left: var(--shell-sidebar-width); height: var(--shell-toolbar-height); background-color: var(--fto-surface); border-bottom: 1px solid var(--fto-line);"
  >
    <div class="flex items-center gap-4">
      <button type="button" class="rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
      <h1 class="text-lg font-semibold" style="color: var(--fto-ink);">
        <!-- SLOT: pageTitle -->仓库入库<!-- /SLOT: pageTitle -->
      </h1>
    </div>

    <div class="flex items-center gap-4">
      <!-- Global Search -->
      <div class="relative hidden sm:block">
        <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
        <input
          type="text"
          placeholder="全局搜索..."
          class="h-9 w-64 rounded-lg pl-9 pr-3 text-sm outline-none focus:ring-2"
          style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
        />
      </div>

      <!-- Notifications -->
      <button type="button" class="relative rounded-md p-2 transition-colors hover:opacity-80" style="color: var(--fto-ink-2);">
        <i data-lucide="bell" class="h-5 w-5"></i>
        <span
          class="absolute right-1.5 top-1.5 flex h-4 min-w-[16px] items-center justify-center rounded-full px-1 text-[10px] font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >3</span>
      </button>

      <!-- User -->
      <div class="flex items-center gap-3">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold"
          style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
        >管</div>
        <span class="hidden text-sm font-medium md:block" style="color: var(--fto-ink);">管理员</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main
    class="min-h-screen"
    style="margin-left: var(--shell-sidebar-width); padding-top: var(--shell-toolbar-height); background-color: var(--fto-background);"
  >
    <div class="p-6">
      <div
        class="rounded-xl p-6"
        style="background-color: var(--fto-card); border: 1px solid var(--fto-line); border-radius: var(--fto-radius-large); box-shadow: var(--fto-shadow-1);"
      >
        <!-- SLOT: pageHeaderActions -->
        <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
          <div class="flex flex-wrap items-center gap-3">
            <label class="text-sm font-medium" style="color: var(--fto-ink-2);">供应商订货单</label>
            <select id="poSelect"
              class="h-9 rounded-lg px-3 text-sm outline-none focus:ring-2"
              style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
            >
              <option value="PO-20260825-A">PO-20260825-A</option>
              <option value="PO-20260825-B">PO-20260825-B</option>
            </select>

            <label class="ml-2 text-sm font-medium" style="color: var(--fto-ink-2);">仓库仓位</label>
            <select id="locationSelect"
              class="h-9 rounded-lg px-3 text-sm outline-none focus:ring-2"
              style="background-color: var(--fto-surface-2); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
            >
              <option value="A-01-02">A-01-02</option>
              <option value="A-03-05">A-03-05</option>
              <option value="B-02-01">B-02-01</option>
              <option value="C-04-03">C-04-03</option>
            </select>
          </div>

          <div class="flex items-center gap-3">
            <button id="startReceiveBtn" type="button"
              class="inline-flex h-9 items-center gap-2 rounded-lg px-4 text-sm font-medium transition-colors hover:opacity-90"
              style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
            >
              <i data-lucide="play" class="h-4 w-4"></i>
              <span>开始收货</span>
            </button>
            <button id="endReceiveBtn" type="button"
              class="inline-flex h-9 items-center gap-2 rounded-lg px-4 text-sm font-medium transition-colors hover:opacity-90"
              style="background-color: var(--fto-state-success); color: var(--fto-primary-foreground);"
            >
              <i data-lucide="check-check" class="h-4 w-4"></i>
              <span>结束收货</span>
            </button>
          </div>
        </div>
        <!-- /SLOT: pageHeaderActions -->

        <!-- SLOT: mainContent -->
        <div class="space-y-6">

          <!-- 顶部大号扫码输入区 -->
          <section
            class="rounded-xl p-6"
            style="background-color: var(--fto-surface-2); border: 1px dashed var(--fto-primary-300); border-radius: var(--fto-radius-large);"
          >
            <div class="mb-3 flex items-center gap-2 text-base font-semibold" style="color: var(--fto-primary-700);">
              <i data-lucide="scan-barcode" class="h-5 w-5"></i>
              <span>扫码入库</span>
            </div>
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
              <div class="relative flex-1">
                <i data-lucide="scan-line" class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2" style="color: var(--fto-ink-3);"></i>
                <input
                  id="barcodeInput"
                  type="text"
                  placeholder="请扫描或输入纸箱条码"
                  autocomplete="off"
                  class="h-14 w-full rounded-lg pl-12 pr-4 text-base outline-none focus:ring-2"
                  style="background-color: var(--fto-card); border: 1px solid var(--fto-input); color: var(--fto-ink); --tw-ring-color: var(--fto-ring);"
                />
              </div>
              <button id="confirmInboundBtn" type="button"
                class="inline-flex h-14 items-center gap-2 rounded-lg px-6 text-base font-semibold transition-colors hover:opacity-90"
                style="background-color: var(--fto-primary); color: var(--fto-primary-foreground);"
              >
                <i data-lucide="arrow-down-to-line" class="h-5 w-5"></i>
                <span>确认入库</span>
              </button>
            </div>
            <p class="mt-3 text-sm" style="color: var(--fto-ink-3);">扫描纸箱条码后按回车或点击确认</p>
          </section>

          <!-- 中间进度卡片区 -->
          <section>
            <h2 class="mb-3 text-sm font-semibold" style="color: var(--fto-ink);">到货进度</h2>
            <div id="progressCards" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <!-- JS 填充 -->
            </div>
          </section>

          <!-- 下部已扫描箱记录表 -->
          <section>
            <div class="mb-3 flex items-center justify-between">
              <h2 class="text-sm font-semibold" style="color: var(--fto-ink);">已扫描箱记录</h2>
              <span id="scanCountBadge"
                class="rounded-full px-2.5 py-0.5 text-xs font-medium"
                style="background-color: var(--fto-primary-100); color: var(--fto-primary-700);"
              >已扫描 0 箱</span>
            </div>
            <div class="overflow-x-auto rounded-xl" style="border: 1px solid var(--fto-line);">
              <table class="w-full text-sm">
                <thead style="background-color: var(--fto-surface-2);">
                  <tr>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">序号</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">纸箱条码</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">SKU</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">供应商订货单</th>
                    <th class="px-4 py-3 text-left font-medium" style="color: var(--fto-ink-2);">入库时间</th>
                    <th class="px-4 py-3 text-center font-medium" style="color: var(--fto-ink-2);">操作</th>
                  </tr>
                </thead>
                <tbody id="scanRecordsBody" style="background-color: var(--fto-card);">
                  <!-- JS 填充 -->
                </tbody>
              </table>
            </div>
          </section>

        </div>
        <!-- /SLOT: mainContent -->
      </div>
    </div>
  </main>

  <script>
    (function () {
      const skuMap = {
        'SKU-1001': { name: '纯棉T恤 XL', expected: 800, received: 790 },
        'SKU-1002': { name: '尼龙运动背包', expected: 500, received: 500 },
        'SKU-1003': { name: '不锈钢保温杯', expected: 1200, received: 560 },
        'SKU-1004': { name: '蓝牙无线耳机', expected: 300, received: 300 }
      };

      let records = [
        { id: 1, barcode: 'BOX-20260825-0001', sku: 'SKU-1001', po: 'PO-20260825-A', time: '2026-08-25 09:12:33' },
        { id: 2, barcode: 'BOX-20260825-0002', sku: 'SKU-1001', po: 'PO-20260825-A', time: '2026-08-25 09:15:07' },
        { id: 3, barcode: 'BOX-20260825-0041', sku: 'SKU-1002', po: 'PO-20260825-A', time: '2026-08-25 09:28:19' },
        { id: 4, barcode: 'BOX-20260825-0105', sku: 'SKU-1003', po: 'PO-20260825-B', time: '2026-08-25 10:02:44' },
        { id: 5, barcode: 'BOX-20260825-0200', sku: 'SKU-1004', po: 'PO-20260825-B', time: '2026-08-25 10:11:58' }
      ];

      const poSelect = document.getElementById('poSelect');
      const locationSelect = document.getElementById('locationSelect');
      const barcodeInput = document.getElementById('barcodeInput');
      const confirmInboundBtn = document.getElementById('confirmInboundBtn');
      const progressCards = document.getElementById('progressCards');
      const scanRecordsBody = document.getElementById('scanRecordsBody');
      const scanCountBadge = document.getElementById('scanCountBadge');

      function formatNow() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }

      function nextBoxBarcode() {
        const max = records.reduce((m, r) => {
          const n = parseInt(r.barcode.replace(/\D/g, ''), 10) || 0;
          return n > m ? n : m;
        }, 0);
        return `BOX-20260825-${String(max + 1).padStart(4, '0')}`;
      }

      function pickSkuForBarcode() {
        const po = poSelect.value;
        const keys = Object.keys(skuMap);
        // PO-A 优先 SKU-1001/1002，PO-B 优先 SKU-1003/1004
        const pool = po === 'PO-20260825-A'
          ? ['SKU-1001', 'SKU-1001', 'SKU-1002']
          : ['SKU-1003', 'SKU-1003', 'SKU-1004'];
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function renderProgressCards() {
        progressCards.innerHTML = '';
        Object.entries(skuMap).forEach(([sku, info]) => {
          const pct = Math.min(100, Math.round((info.received / info.expected) * 100));
          const complete = info.received >= info.expected;
          const statusText = complete ? '已收齐' : '部分到货';
          const statusBg = complete ? 'var(--fto-state-success-bg)' : 'var(--fto-state-warning-bg)';
          const statusColor = complete ? 'var(--fto-state-success)' : 'var(--fto-state-warning)';

          const card = document.createElement('div');
          card.className = 'rounded-lg p-4';
          card.style.backgroundColor = 'var(--fto-surface-2)';
          card.style.border = '1px solid var(--fto-line)';
          card.innerHTML = `
            <div class="mb-2 flex items-center justify-between">
              <span class="text-sm font-semibold" style="color: var(--fto-ink);">${sku}</span>
              <span class="rounded-full px-2 py-0.5 text-xs font-medium" style="background-color: ${statusBg}; color: ${statusColor};">${statusText}</span>
            </div>
            <div class="mb-1 text-xs" style="color: var(--fto-ink-2);">${info.name}</div>
            <div class="mb-2 flex items-end justify-between">
              <span class="text-2xl font-bold" style="color: var(--fto-primary);">${info.received}</span>
              <span class="mb-1 text-xs" style="color: var(--fto-ink-3);">/ ${info.expected}</span>
            </div>
            <div class="h-2 w-full rounded-full" style="background-color: var(--fto-slate-200);">
              <div class="h-2 rounded-full transition-all duration-300" style="width: ${pct}%; background-color: ${complete ? 'var(--fto-state-success)' : 'var(--fto-primary)'};"></div>
            </div>
            <div class="mt-1 text-right text-xs" style="color: var(--fto-ink-3);">${pct}%</div>
          `;
          progressCards.appendChild(card);
        });
      }

      function renderRecords() {
        scanRecordsBody.innerHTML = '';
        records.slice().reverse().forEach((record, idx) => {
          const row = document.createElement('tr');
          row.style.borderTop = '1px solid var(--fto-line)';
          row.innerHTML = `
            <td class="px-4 py-3" style="color: var(--fto-ink-2);">${records.length - idx}</td>
            <td class="px-4 py-3 font-mono" style="color: var(--fto-ink);">${record.barcode}</td>
            <td class="px-4 py-3" style="color: var(--fto-ink);">${record.sku}</td>
            <td class="px-4 py-3" style="color: var(--fto-ink-2);">${record.po}</td>
            <td class="px-4 py-3" style="color: var(--fto-ink-2);">${record.time}</td>
            <td class="px-4 py-3 text-center">
              <button type="button" data-barcode="${record.barcode}" class="scan-undo inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium transition-colors hover:opacity-80" style="background-color: var(--fto-state-error-bg); color: var(--fto-state-error);">
                <i data-lucide="rotate-ccw" class="h-3 w-3"></i>
                <span>撤销</span>
              </button>
            </td>
          `;
          scanRecordsBody.appendChild(row);
        });
        scanCountBadge.textContent = `已扫描 ${records.length} 箱`;
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      function addInbound(barcode) {
        const value = (barcode || '').trim();
        if (!value) return;
        const sku = pickSkuForBarcode();
        if (!skuMap[sku]) return;
        skuMap[sku].received += 1;
        records.push({
          id: Date.now(),
          barcode: value.startsWith('BOX-') ? value : nextBoxBarcode(),
          sku,
          po: poSelect.value,
          time: formatNow()
        });
        renderProgressCards();
        renderRecords();
        barcodeInput.value = '';
        barcodeInput.focus();
      }

      function undoInbound(barcode) {
        const idx = records.findIndex(r => r.barcode === barcode);
        if (idx === -1) return;
        const record = records[idx];
        if (skuMap[record.sku]) {
          skuMap[record.sku].received = Math.max(0, skuMap[record.sku].received - 1);
        }
        records.splice(idx, 1);
        renderProgressCards();
        renderRecords();
      }

      barcodeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addInbound(barcodeInput.value);
        }
      });

      confirmInboundBtn.addEventListener('click', function () {
        addInbound(barcodeInput.value);
      });

      scanRecordsBody.addEventListener('click', function (e) {
        const btn = e.target.closest('.scan-undo');
        if (btn) {
          undoInbound(btn.dataset.barcode);
        }
      });

      document.getElementById('startReceiveBtn').addEventListener('click', function () {
        barcodeInput.focus();
      });

      document.getElementById('endReceiveBtn').addEventListener('click', function () {
        alert('收货已结束，当前共扫描 ' + records.length + ' 箱。');
      });

      renderProgressCards();
      renderRecords();
      barcodeInput.focus();
    })();
  </script>

    <style>
      :root {
        --shell-sidebar-width: 240px;
        --shell-toolbar-height: 64px;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</body>
</html>
