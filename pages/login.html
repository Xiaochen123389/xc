    <style>
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* Login page specific */
      .login-bg {
        background-color: #0a2540;
        background-image:
          radial-gradient(ellipse at 80% 80%, rgba(255,140,50,.3) 0%, transparent 60%),
          linear-gradient(135deg, rgba(0,40,80,.85) 0%, rgba(0,80,130,.7) 50%, rgba(20,60,100,.9) 100%);
      }
      .login-input {
        width: 100%;
        height: 40px;
        padding: 0 11px 0 35px;
        border: 1px solid #d9d9d9;
        border-radius: 2px;
        font-size: 14px;
        color: #262626;
        background: #ffffff;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
        box-sizing: border-box;
        font-family: inherit;
      }
      .login-input::placeholder {
        color: #bfbfbf;
      }
      .login-input:hover {
        border-color: #40a9ff;
      }
      .login-input:focus {
        border-color: #0078c8;
        box-shadow: 0 0 0 2px rgba(0,120,200,.2);
      }
      .login-input.has-right-icon {
        padding-right: 35px;
      }
      .login-input-icon-left {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: #bfbfbf;
        pointer-events: none;
        width: 16px;
        height: 16px;
      }
      .login-input-icon-right {
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: #bfbfbf;
        cursor: pointer;
        width: 16px;
        height: 16px;
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-input-icon-right:hover {
        color: #0078c8;
      }
      .login-btn {
        width: 100%;
        height: 40px;
        background: #0078c8;
        color: #ffffff;
        border: none;
        border-radius: 2px;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        transition: background .2s;
        font-family: inherit;
      }
      .login-btn:hover {
        background: #006bb0;
      }
      .login-btn:active {
        background: #005a96;
      }
      .login-btn:disabled {
        opacity: .7;
        cursor: not-allowed;
      }
      /* Captcha */
      .captcha-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .captcha-input-wrap {
        position: relative;
        flex: 1;
      }
      .captcha-box {
        width: 110px;
        height: 40px;
        border: 1px solid #d9d9d9;
        border-radius: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,.03) 8px, rgba(0,0,0,.03) 16px);
        user-select: none;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
        transition: border-color .2s;
      }
      .captcha-box:hover {
        border-color: #0078c8;
      }
      .captcha-char {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        font-family: 'Georgia', serif;
        font-style: italic;
        text-shadow: 1px 1px 0 rgba(0,0,0,.1);
      }
      .captcha-refresh-hint {
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 10px;
        color: #8c8c8c;
      }
      /* Remember me */
      .login-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 13px;
      }
      .remember-me {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #595959;
        cursor: pointer;
        user-select: none;
      }

        width: 14px;
        height: 14px;
        accent-color: #0078c8;
        cursor: pointer;
      }

        color: #0078c8;
        cursor: pointer;
        font-size: 13px;

        color: #ff4d4f;

        display: block;

      /* Shake animation */

        animation: shake .4s ease;
      }

        font-size: 12px;
        color: #8c8c8c;
        margin-top: -32px;
        margin-bottom: 28px;
        letter-spacing: 2px;
      }

    <script>
      // ======= Toast 组件 =======
      function showToast(message, type) {
        type = type || 'info';
        if (window.toast) { window.toast(message, type); return; }
        var colors = {success:'#52c41a',error:'#ff4d4f',warning:'#faad14',info:'#0078c8'};
        var icons = {success:'check-circle',error:'x-circle',warning:'alert-triangle',info:'info'};
        var t = document.createElement('div');
        t.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);background:#fff;padding:10px 16px;border-radius:2px;box-shadow:0 3px 14px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;font-size:14px;color:#262626;z-index:9999;opacity:0;transition:all .3s;border-left:3px solid '+colors[type]+';';
        t.innerHTML = '<i data-lucide="'+icons[type]+'" style="width:16px;height:16px;color:'+colors[type]+'"></i><span>'+message+'</span>';
        document.body.appendChild(t);
        if (window.lucide) lucide.createIcons({root:t});
        requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
        setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(-20px)'; setTimeout(function(){t.remove();},300); },2500);
      }

      // 添加spin和shake动画
      if(!document.getElementById('login-anim-styles')){
        var s=document.createElement('style');s.id='login-anim-styles';
        s.textContent='@keyframes spin{to{transform:rotate(360deg)}} @keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}';
        document.head.appendChild(s);
      }

      // ======= 验证码生成 =======
      var captchaCode = '';
      var captchaChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 避开0/O/1/l/I
      function generateCaptcha() {
        captchaCode = '';
        for (var i = 0; i < 4; i++) {
          captchaCode += captchaChars.charAt(Math.floor(Math.random() * captchaChars.length));
        }
        // 给每个字符随机颜色
        var colors = ['#0078c8','#52c41a','#faad14','#ff4d4f','#722ed1','#13c2c2'];
        var html = '';
        for (var i = 0; i < captchaCode.length; i++) {
          var color = colors[Math.floor(Math.random()*colors.length)];
          var rotate = (Math.random()*30-15).toFixed(0);
          html += '<span style="color:'+color+';display:inline-block;transform:rotate('+rotate+'deg);margin:0 1px;">'+captchaCode[i]+'</span>';
        }
        document.getElementById('captchaChar').innerHTML = html;
      }

      // ======= 错误提示 =======
      function showFieldError(inputId, message) {
        var input = document.getElementById(inputId);
        if (!input) return;
        clearFieldError(inputId);
        input.classList.add('error');
        var tip = document.createElement('span');
        tip.className = 'login-error-tip';
        tip.id = inputId + '-error';
        tip.textContent = message;
        input.parentElement.appendChild(tip);
      }
      function clearFieldError(inputId) {
        var input = document.getElementById(inputId);
        if (!input) return;
        input.classList.remove('error');
        var tip = document.getElementById(inputId + '-error');
        if (tip) tip.remove();
      }

      // ======= 实时校验 =======
      function validateUsername() {
        var v = document.getElementById('usernameInput').value.trim();
        if (!v) { showFieldError('usernameInput','请输入用户名'); return false; }
        if (v.length < 2) { showFieldError('usernameInput','用户名至少2个字符'); return false; }
        clearFieldError('usernameInput');
        return true;
      }
      function validatePassword() {
        var v = document.getElementById('pwdInput').value;
        if (!v) { showFieldError('pwdInput','请输入密码'); return false; }
        if (v.length < 6) { showFieldError('pwdInput','密码长度至少6位'); return false; }
        clearFieldError('pwdInput');
        return true;
      }
      function validateCaptcha() {
        var v = document.getElementById('captchaInput').value.trim();
        if (!v) { showFieldError('captchaInput','请输入验证码'); return false; }
        if (v.length !== 4) { showFieldError('captchaInput','验证码为4位'); return false; }
        clearFieldError('captchaInput');
        return true;
      }

      // ======= DOM初始化 =======
      document.addEventListener('DOMContentLoaded', function() {
        lucide.createIcons();

        // 初始化验证码
        generateCaptcha();
        document.getElementById('captchaBox').addEventListener('click', function(e) {
          e.preventDefault();
          generateCaptcha();
          document.getElementById('captchaInput').value = '';
          clearFieldError('captchaInput');
        });

        // 密码切换（兼容已有IIFE）
        var toggleBtn = document.getElementById('togglePwd');
        var pwdInput = document.getElementById('pwdInput');
        var pwdVisible = false;
        if (toggleBtn && pwdInput) {
          // 移除可能的重复绑定（通过clone节点方式不安全，直接检查）
          toggleBtn.onclick = function() {
            pwdVisible = !pwdVisible;
            pwdInput.type = pwdVisible ? 'text' : 'password';
            toggleBtn.innerHTML = pwdVisible
              ? '<i data-lucide="eye" style="width:16px;height:16px;"></i>'
              : '<i data-lucide="eye-off" style="width:16px;height:16px;"></i>';
            lucide.createIcons({root: toggleBtn});
          };
        }

        // 记住账号 - 读取localStorage
        var savedUser = localStorage.getItem('tms_remember_user');
        if (savedUser) {
          document.getElementById('usernameInput').value = savedUser;
          document.getElementById('rememberMe').checked = true;
        }

        // 失焦校验
        document.getElementById('usernameInput').addEventListener('blur', validateUsername);
        document.getElementById('pwdInput').addEventListener('blur', validatePassword);
        document.getElementById('captchaInput').addEventListener('blur', validateCaptcha);

        // 输入时清除错误
        ['usernameInput','pwdInput','captchaInput'].forEach(function(id) {
          document.getElementById(id).addEventListener('input', function() {
            clearFieldError(id);
          });
        });

        // ======= 登录按钮逻辑 =======
        var loginBtn = document.getElementById('loginBtn');
        var userInput = document.getElementById('usernameInput');
        var capInput = document.getElementById('captchaInput');

        function doLogin() {
          // 校验所有字段
          var ok1 = validateUsername();
          var ok2 = validatePassword();
          var ok3 = validateCaptcha();
          if (!ok1 || !ok2 || !ok3) {
            // 抖动效果
            var card = loginBtn.closest('div[style*="background:#ffffff"]') || loginBtn.parentElement;
            card.classList.add('shake');
            setTimeout(function(){ card.classList.remove('shake'); }, 500);
            return;
          }

          var u = userInput.value.trim();
          var p = pwdInput.value;
          var c = capInput.value.trim();

          // 验证码校验（不区分大小写）
          if (c.toUpperCase() !== captchaCode.toUpperCase()) {
            showFieldError('captchaInput','验证码错误');
            showToast('验证码错误，请重新输入','error');
            var box = document.getElementById('captchaBox');
            box.classList.add('shake');
            setTimeout(function(){ box.classList.remove('shake'); }, 500);
            generateCaptcha();
            capInput.value = '';
            return;
          }

          // Loading状态
          if (window.setBtnLoading) {
            setBtnLoading(loginBtn, '登录中...');
          } else {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;"><i data-lucide="loader-2" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i>登录中...</span>';
            lucide.createIcons({root: loginBtn});
          }

          setTimeout(function() {
            if ((u === 'wb') && p === 'Wb123456') {
              // 记住账号
              if (document.getElementById('rememberMe').checked) {
                localStorage.setItem('tms_remember_user', u);
              } else {
                localStorage.removeItem('tms_remember_user');
              }
              showToast('登录成功，欢迎回来','success');
              if (window.resetBtn) resetBtn(loginBtn);
              loginBtn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;"><i data-lucide="check" style="width:16px;height:16px;"></i>登录成功</span>';
              lucide.createIcons({root: loginBtn});
              setTimeout(function(){ window.location.href = 'dashboard.html'; }, 800);
            } else {
              showToast('用户名或密码错误（测试账号：wb / Wb123456）','error');
              if (window.resetBtn) resetBtn(loginBtn);
              else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登录员工账号';
              }
              loginBtn.style.backgroundColor = '#ff4d4f';
              setTimeout(function(){ loginBtn.style.backgroundColor = ''; }, 600);
              // 刷新验证码
              generateCaptcha();
              capInput.value = '';
            }
          }, 1200);
        }

        loginBtn.addEventListener('click', doLogin);

        // 回车提交
        [userInput, pwdInput, capInput].forEach(function(inp) {
          inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
          });
        });
      });
    </script>
    <script src="../assets/app.js"></script>
</body>
</html>
