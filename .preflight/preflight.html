<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  /* Brand primary - Deep blue for logistics/professional trust */
  --scm-brand: #1e40af;
  --scm-brand-hover: #1e3a8a;
  --scm-brand-light: #dbeafe;
  --scm-brand-ink: #ffffff;

  /* Surface system */
  --scm-bg: #f1f5f9;
  --scm-surface: #ffffff;
  --scm-surface-2: #f8fafc;
  --scm-surface-hover: #f1f5f9;

  /* Text system */
  --scm-ink: #0f172a;
  --scm-ink-2: #475569;
  --scm-ink-3: #94a3b8;

  /* Border / Line */
  --scm-line: #e2e8f0;
  --scm-border: #e2e8f0;
  --scm-input: #cbd5e1;
  --scm-ring: #1e40af;

  /* Semantic state colors */
  --scm-state-success: #16a34a;
  --scm-state-success-bg: #dcfce7;
  --scm-state-warning: #d97706;
  --scm-state-warning-bg: #fef3c7;
  --scm-state-error: #dc2626;
  --scm-state-error-bg: #fee2e2;
  --scm-state-info: #2563eb;
  --scm-state-info-bg: #dbeafe;

  /* Radius scale */
  --scm-radius-sm: 4px;
  --scm-radius-md: 8px;
  --scm-radius-lg: 12px;

  /* Shadows for floating layers only */
  --scm-shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --scm-shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --scm-shadow-lg: 0 8px 24px rgba(15,23,42,.12);

  /* Sidebar specific */
  --scm-sidebar-bg: #0f172a;
  --scm-sidebar-ink: #cbd5e1;
  --scm-sidebar-ink-active: #ffffff;
  --scm-sidebar-active: #1e40af;
  --scm-sidebar-hover: #1e293b;

  /* Semantic aliases for Tailwind */
  --background: var(--scm-bg);
  --foreground: var(--scm-ink);
  --card: var(--scm-surface);
  --card-foreground: var(--scm-ink);
  --popover: var(--scm-surface);
  --popover-foreground: var(--scm-ink);
  --primary: var(--scm-brand);
  --primary-foreground: var(--scm-brand-ink);
  --secondary: var(--scm-surface-2);
  --secondary-foreground: var(--scm-ink);
  --muted: var(--scm-surface-2);
  --muted-foreground: var(--scm-ink-2);
  --accent: var(--scm-surface-2);
  --accent-foreground: var(--scm-ink);
  --destructive: var(--scm-state-error);
  --destructive-foreground: #ffffff;
  --border: var(--scm-line);
  --input: var(--scm-input);
  --ring: var(--scm-ring);
  --radius-sm: var(--scm-radius-sm);
  --radius-md: var(--scm-radius-md);
  --radius-lg: var(--scm-radius-lg);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--scm-border);
    --color-input: var(--scm-input);
    --color-ring: var(--scm-ring);
    --color-background: var(--scm-bg);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --radius-sm: var(--scm-radius-sm);
    --radius-md: var(--scm-radius-md);
    --radius-lg: var(--scm-radius-lg);
  }
  @layer base {
    body { background: var(--scm-bg); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-muted { background-color: var(--muted); }

      .border-muted-foreground { border-color: var(--muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--muted-foreground); }
      .bg-accent { background-color: var(--accent); }
      .text-accent { color: var(--accent); }
      .border-accent { border-color: var(--accent); }

      .bg-accent-foreground { background-color: var(--accent-foreground); }

      .ring-accent-foreground { --tw-ring-color: var(--accent-foreground); }
      .bg-destructive { background-color: var(--destructive); }
      .text-destructive { color: var(--destructive); }

      .ring-destructive-foreground { --tw-ring-color: var(--destructive-foreground); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
